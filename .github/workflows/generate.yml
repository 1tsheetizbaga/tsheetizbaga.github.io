name: Generate AI Article

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Discover topics
        run: |
           python scripts/discover_topic.py

            - name: Discover topics
        run: |
          python scripts/discover_topic.py

      - name: Generate article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generate_post.py

      - name: Commit generated article
        run: |
          git config user.name "AI Article Bot"
          git config user.email "actions@github.com"

          git add generated/ posts/ index.html

          git diff --cached --quiet || git commit -m "Generate AI article"

          git push
